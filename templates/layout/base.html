<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <script src="https://unpkg.com/popper.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href='http://fonts.googleapis.com/css?family=Raleway:400,300,700' rel='stylesheet' type='text/css' />
    <script src="https://kit.fontawesome.com/7d8cfc191d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/css/common.css" />
    <title>{% block title %}{% endblock %} &mdash; SweetRPG </title>
    {% block css %}{% endblock %}
</head>

<body>
    <noscript>
        <strong>We're sorry but this application requires JavaScript to work correctly. Please enable it to continue.</strong>
    </noscript>

{% include 'partials/header.html' %}

<div class="container mt-3">
    {% block content %}
    {% endblock %}
</div>

{% if showCookieMessage %}
<footer id="cookie-footer">
    <div id="cookieMessage" class="container">
        <span class="muted">
            This site uses cookies! To accept this, click
            <a href="#" onclick="cookiesConfirmed()">OK</a>
        </span>
    </div>
</footer>

<script src="/static/js/cookies.js"></script>
{% endif %}

    {% include 'partials/footer.html' %}

    <script src="/static/js/common.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
{% block scripts %}{% endblock %}
    </body>

</html>
