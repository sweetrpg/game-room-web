---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-web-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-misc
        creationPolicy: Owner
    dataFrom:
        # TODO: still points at the pre-rename Akeyless path - migrate the secret to
        # /sweetrpg/game-room/web/misc (needs Akeyless access this session didn't have) and
        # update this key before relying on web-misc contents post-rename.
        - extract:
              key: /sweetrpg/game-room/web/misc
