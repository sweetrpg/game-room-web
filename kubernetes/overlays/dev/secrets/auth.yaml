---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-web-auth

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0
