---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-game-room

resources:
    - ../../base
    - configmaps.yaml
    - ingress.yaml
    - middlewares/errors.yaml
    - middlewares/strip.yaml
    - pod-monitor.yaml
    - secrets/cache.yaml
    - secrets/misc.yaml
    - secrets/shared-session.yaml

labels:
    - pairs:
        app.kubernetes.io/name: game-room-web
        app.kubernetes.io/version: v1
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: game-room
        com.sweetrpg/env: dev
      includeSelectors: false
      includeTemplates: true

generatorOptions:
    disableNameSuffixHash: true
