---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-library

resources:
  - namespace.yaml
  - ../../base
  - configmaps.yaml
  - middlewares.yaml
  - ingress-route.yaml
secretGenerator:
  - name: sweetrpg-registry
    type: kubernetes.io/dockerconfigjson
    files:
      - .dockerconfigjson

commonLabels:
  platform: sweetrpg
  app: library
  component: web

generatorOptions:
  disableNameSuffixHash: true
