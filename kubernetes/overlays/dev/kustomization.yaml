---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-library

resources:
    - namespace.yaml
    - ../../base
    - configmaps.yaml
    - destination-rules.yaml
patchesStrategicMerge:
    - replicas.yaml

commonLabels:
    app: library-web
    version: v1
    platform: sweetrpg
    package: library
    component: web

generatorOptions:
    disableNameSuffixHash: true
