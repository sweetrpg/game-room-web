---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-web-auth

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-web-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-misc
        creationPolicy: Owner
    dataFrom:
        # TODO: still points at the pre-rename Akeyless path - migrate the secret to
        # /sweetrpg/game-room/web/misc (needs Akeyless access this session didn't have) and
        # update this key before relying on web-misc contents post-rename.
        - extract:
              key: /sweetrpg/library/web/misc

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-web-cache

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-cache
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/support/cache/client

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-web-files

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-files
        creationPolicy: Owner
        template:
            type: Opaque
            data:
                newrelic.ini: "{{ .contents | toString }}"
    data:
        - secretKey: contents
          remoteRef:
              key: NewRelic

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: game-room-template-credentials

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: template-credentials
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: TemplateRepo
