---
# See more at https://istio.io/docs/reference/config/networking/virtual-service/
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService

metadata:
    name: web-v1

spec:
    hosts:
        - dev.sweetrpg.com
    gateways:
        - sweetrpg-main/gateway
    http:
        - route:
              - destination:
                    host: web-v1
                    port:
                        number: 8282
