---
kind: Service
apiVersion: v1

metadata:
    name: web-v1

spec:
    selector:
        platform: sweetrpg
        app: sweetrpg-library-web-v1
        package: library
        component: web
        version: v1
    type: LoadBalancer
    ports:
        - name: http
          port: 8282
          targetPort: http
