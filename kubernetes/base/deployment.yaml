---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: web-v1

spec:
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 1
        type: RollingUpdate
    selector:
        matchLabels:
            app: web
            version: v1
            platform: sweetrpg
            package: game-room
            component: web
    template:
        metadata:
            labels:
                app: web
                version: v1
                platform: sweetrpg
                package: game-room
                component: web
            annotations:
                reloader.stakater.com/auto: "true"
                openfeature.dev/enabled: "true"
                openfeature.dev/featureflagsource: "sweetrpg-system/game-room-web"
        spec:
            serviceAccountName: web
            imagePullSecrets:
                - name: sweetrpg-registry
            initContainers:
                - name: init-templates
                  image: alpine/git
                  args:
                      - clone
                      - "--single-branch"
                      - "--"
                      - "https://$(GIT_USERNAME):$(GIT_PASSWORD)@github.com/$(GIT_REPO).git"
                      - "/work/."
                  envFrom:
                      - secretRef:
                            name: template-credentials
                  volumeMounts:
                      - mountPath: /work
                        name: templates
            containers:
                - name: app
                  image: game-room-web
                  imagePullPolicy: Always
                  envFrom:
                      - configMapRef:
                            name: web-common
                      - configMapRef:
                            name: web-env
                      - secretRef:
                            name: web-auth
                      - secretRef:
                            name: web-misc
                      - secretRef:
                            name: web-cache
                  env: []
                  ports:
                      - containerPort: 8282
                        name: http
                  resources:
                      requests:
                          cpu: "20m"
                          memory: "55Mi"
                      limits:
                          cpu: "1.0"
                          memory: "1Gi"
                  livenessProbe:
                      httpGet:
                          path: /health/ping
                          port: http
                      initialDelaySeconds: 90
                      timeoutSeconds: 10
                  readinessProbe:
                      httpGet:
                          path: /health/ping
                          port: http
                      initialDelaySeconds: 30
                      timeoutSeconds: 10
                  volumeMounts:
                      - mountPath: /data
                        name: data
                      - mountPath: /config
                        name: config
                      - mountPath: /app/templates
                        name: templates
                        subPath: templates
            volumes:
                - name: config
                  secret:
                      secretName: web-files
                      items:
                          - key: newrelic.ini
                            path: newrelic.ini
                - name: data
                  emptyDir: {}
                - name: templates
                  emptyDir: {}
            restartPolicy: Always
