---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: web-v1

spec:
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 1
        type: RollingUpdate
    selector:
        matchLabels:
            app.kubernetes.io/name: game-room-web
            app.kubernetes.io/version: v1
            app.kubernetes.io/component: web
    template:
        metadata:
            annotations:
                reloader.stakater.com/auto: "true"
                openfeature.dev/enabled: "true"
                openfeature.dev/featureflagsource: "sweetrpg-system/game-room-web"
        spec:
            serviceAccountName: web
            imagePullSecrets:
                - name: sweetrpg-registry
            containers:
                - name: app
                  image: game-room-web
                  imagePullPolicy: Always
                  envFrom:
                      - configMapRef:
                            name: web-common
                      - configMapRef:
                            name: web-env
                      - secretRef:
                            name: web-misc
                      - secretRef:
                            name: web-cache
                      - secretRef:
                            name: web-shared-session
                  env: []
                  ports:
                      - containerPort: 8282
                        name: http
                  resources:
                      requests:
                          cpu: "20m"
                          memory: "55Mi"
                      limits:
                          cpu: "1.0"
                          memory: "1Gi"
                  livenessProbe:
                      httpGet:
                          path: /health/ping
                          port: http
                      initialDelaySeconds: 90
                      timeoutSeconds: 10
                  readinessProbe:
                      httpGet:
                          path: /health/ping
                          port: http
                      initialDelaySeconds: 30
                      timeoutSeconds: 10
                  volumeMounts:
                      - mountPath: /data
                        name: data
            volumes:
                - name: data
                  emptyDir: {}
            restartPolicy: Always
