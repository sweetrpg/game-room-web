<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/static/css/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/vendor/fontawesome/all.min.css" rel="stylesheet" />
  <link href="/static/css/vendor/leaguespartan/stylesheet.css" rel="stylesheet" />
  <link href="/static/css/vendor/leander/stylesheet.css" rel="stylesheet" />
  <link href="/static/css/common.css" rel="stylesheet" />
  <link href="/static/favicon.ico" rel="shortcut icon" />
  <title>SweetRPG Library</title>
</head>

<body>
  <noscript>
    <strong>
      We're sorry but this application requires JavaScript to work correctly.
      Please enable it to continue.
    </strong>
  </noscript>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>

  {% if showCookieMessage %}
  <footer id="cookie-footer">
    <div id="cookieMessage" class="container">
      <span class="muted">
        This site uses cookies! To accept this, click
        <a href="#" onclick="cookiesConfirmed()">OK</a>
      </span>
    </div>
  </footer>

  <script src="/static/js/cookies.js" type="text/javascript"></script>
  {% endif %}

  <script src="/static/js/vendor/jquery/jquery.min.js" type="text/javascript"></script>
  <script src="/static/js/vendor/popper/popper.min.js" type="text/javascript"></script>
  <script src="/static/js/vendor/bootstrap/bootstrap.min.js" type="text/javascript"></script>
  <script src="/static/js/common.js" type="text/javascript"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
