[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sweetrpg-game-room-web"
version = "0.0.106"
description = "Game Room web frontend for SweetRPG"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Paul Schifferer", email = "dm@sweetrpg.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "blinker~=1.0",
    "dnspython~=2.0",
    "Flask-Babel~=4.0",
    "Flask-Caching~=2.0",
    "Flask-CORS>=5,<7",
    "Flask-DotEnv~=0.1",
    "Flask-Session~=0.5",
    "Flask~=3.0",
    "kanka~=0.1",
    "python-dateutil~=2.0",
    "python-dotenv~=1.0",
    "python-editor~=1.0",
    "PyYAML~=6.0",
    "hiredis~=3.0",
    "redis>=5,<9",
    "requests~=2.0",
    "sentry-sdk[flask]~=2.0",
    "SQLAlchemy~=2.0",
    "sweetrpg-admin-api-client @ git+https://github.com/sweetrpg/admin-api-client.py.git@develop",
    "sweetrpg-client",
    "sweetrpg-game-room-objects",
    "sweetrpg-web-core",
    "urllib3~=2.0",
]

[project.urls]
Documentation = "https://sweetrpg.github.io/game-room-web"

[project.scripts]
sweetrpg-game-room-web = "sweetrpg_game_room_web.cli:main"

[dependency-groups]
deploy = [
    "uwsgi~=2.0",
]
test = [
    "asgiref",
    "coverage-badge~=1.0",
    "pytest~=9.0",
    "pytest-cov~=7.0",
]
docs = [
    "Pallets-Sphinx-Themes",
    "Sphinx",
    "sphinx-issues",
    "sphinxcontrib-log-cabinet",
    "sphinx-tabs",
    "rstcheck",
]
dev = [
    "ruff>=0.16.5",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sweetrpg_game_room_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:warnings --doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
branch = true
source = [
    "sweetrpg_game_room_web",
    "tests",
]

[tool.coverage.paths]
source = [
    "src",
    "*/site-packages",
]
