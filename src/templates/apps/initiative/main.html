{% extends 'layout/base.html' %}

{% set appname = "Initiative!" %}

{% block title %}Initiative{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ static_asset_prefix }}/css/apps/initiative/common.css" />
<link rel="stylesheet" href="{{ static_asset_prefix }}/css/apps/initiative/main.css" />
{% endblock %}

{% block content %}

<div class="btn-group" role="group">
    <button id="btnGroupCreate" type="button" class="btn btn-lg btn-primary dropdown-toggle" data-toggle="dropdown"
        aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-plus-square"></i>
        Create
    </button>
    <div class="dropdown-menu" aria-labelledby="btnGroupCreate">
        <a class="dropdown-item" href="#" data-toggle="modal" data-target="#createEncounterDialog">Encounter</a>
        <a class="dropdown-item" href="#" data-toggle="modal" data-target="#createGroupDialog">Group</a>
    </div>
</div>

{% raw %}
<div id="app">
    <div>
        <create-encounter-dialog />
    </div>
    <div>
        <delete-encounter-dialog />
    </div>
    <div>
        <create-group-dialog />
    </div>
    <div>
        <delete-group-dialog />
    </div>
    <hr />
    <div>
        <encounter-list />
    </div>
    <hr />
    <div>
        <group-list />
    </div>
</div>
{% endraw %}
</div>

{% endblock %}

{% block scripts %}
<script src="{{ static_asset_prefix }}/js/vendor/moment/moment.min.js"></script>
<script src="{{ static_asset_prefix }}/js/vendor/lodash/lodash.js"></script>
<script src="{{ static_asset_prefix }}/js/vendor/axios/axios.min.js"></script>
<script src="{{ static_asset_prefix }}/js/vendor/vue/vue.min.js"></script>
<script src="{{ static_asset_prefix }}/js/vendor/vue/vuex.min.js"></script>
<script src="{{ static_asset_prefix }}/js/apps/initiative/common.js"></script>
<script src="{{ static_asset_prefix }}/components/initiative/CreateEncounterDialog.js"></script>
<script src="{{ static_asset_prefix }}/components/initiative/DeleteEncounterDialog.js"></script>
<script src="{{ static_asset_prefix }}/components/initiative/CreateGroupDialog.js"></script>
<script src="{{ static_asset_prefix }}/components/initiative/DeleteGroupDialog.js"></script>
<script src="{{ static_asset_prefix }}/components/initiative/EncounterItem.js"></script>
<script src="{{ static_asset_prefix }}/components/initiative/EncounterList.js"></script>
<script src="{{ static_asset_prefix }}/components/initiative/GroupItem.js"></script>
<script src="{{ static_asset_prefix }}/components/initiative/GroupList.js"></script>
<script src="{{ static_asset_prefix }}/js/apps/initiative/main.js"></script>
{% endblock %}
