[bdist_wheel]
universal = 1

[metadata]
name = sweetrpg-game-room-web
version = attr: sweetrpg_game_room_web.__version__
url = https://sweetrpg.com
project_urls =
    Documentation = https://sweetrpg.github.io/game-room-web
license = MIT
author = Paul Schifferer
author_email = dm@sweetrpg.com
long_description = file: README.md
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Web Environment
    Framework :: Flask
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Topic :: Internet :: WWW/HTTP :: WSGI :: Application

[options]
packages = find:
package_dir = = src
include_package_data = true
python_required = >= 3.14

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    sweetrpg-game-room-web = sweetrpg_game_room_web.cli:main

[tool:pytest]
testpaths = tests
filterwarnings =
    error

[coverage:run]
branch = True
source =
    sweetrpg_game_room_web
    tests

[coverage:paths]
source =
    src
    */site-packages

[semantic_release]
version_variable = src/sweetrpg_game_room_web/__init__.py:__version__
branch = develop
upload_to_pypi = False
